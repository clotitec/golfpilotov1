<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparar mapas · Golf de Llanes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1f2530; --ink:#e8eaed; --soft:#9aa0a6;
    --line:rgba(255,255,255,.10); --accent:#16a34a; --accent2:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  #app{display:flex;height:100vh}
  #side{width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;overflow:hidden}
  #map{flex:1;background:#000}
  .head{padding:14px 16px;border-bottom:1px solid var(--line)}
  .head h1{margin:0;font-size:16px;font-weight:600}
  .head p{margin:4px 0 0;font-size:12px;color:var(--soft);line-height:1.4}
  .sec{padding:12px 16px;border-bottom:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
       background:var(--panel2);color:var(--ink);font-size:13px;cursor:pointer}
  .btn:hover{background:#2a3140}
  .stats{display:flex;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
  .stat b{display:block;font-size:18px;font-weight:700}
  .stat small{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
  #legend{flex:1;overflow:auto;padding:8px 12px}
  .li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:5px;
      background:var(--panel2);cursor:pointer}
  .li:hover{background:#2a3140}
  .li .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;
           background:var(--accent);color:#fff;flex:0 0 24px}
  .li .info{flex:1;min-width:0}
  .li .info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li .info small{font-size:11px;color:var(--soft)}
  .foot{padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--soft)}
  .leaflet-container{background:#000}
  .hole-num{background:#16a34a;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;
            display:grid;place-items:center;font:700 13px/1 sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.7)}
  .flag{font-size:22px;text-shadow:0 1px 3px rgba(0,0,0,.8);line-height:1}
  .dist{background:rgba(0,0,0,.65);color:#fde047;font:600 11px/1 sans-serif;padding:2px 6px;border-radius:6px;white-space:nowrap}
  #drop-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--soft);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="head">
      <h1 id="course-title">⛳ Plano del campo</h1>
      <p id="course-sub">Carga el <code>holes.json</code> que exportaste en el editor.</p>
    </div>
    <div class="sec">
      <button class="btn" id="btn-load">📂 Cargar holes.json</button>
      <input type="file" id="file-holes" accept=".json" hidden>
    </div>
    <div class="stats" id="stats" style="display:none">
      <div class="stat"><b id="st-holes">0</b><small>hoyos</small></div>
      <div class="stat"><b id="st-par">—</b><small>par total</small></div>
      <div class="stat"><b id="st-dist">—</b><small>metros</small></div>
    </div>
    <div id="legend"></div>
    <div class="foot">Plano de solo lectura. Para editar áreas, tee o green abre <a href="editor.html" style="color:var(--accent2)">el editor</a>.</div>
  </aside>
  <div id="map" style="position:relative"><div id="drop-hint">Arrastra aquí tu holes.json o pulsa “Cargar”.</div></div>
</div>

<script>
"use strict";

const LLANES_CENTER = [43.419, -4.712];
const LLANES_ZOOM = 15;

const map = L.map('map', { zoomControl:true, center:LLANES_CENTER, zoom:LLANES_ZOOM });

// --- Capas base para comparar (selector arriba a la derecha) ---
const A = 'https://server.arcgisonline.com/ArcGIS/rest/services';
const esriSat   = L.tileLayer(A+'/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Esri World Imagery', maxZoom:19 });
const esriLabel = L.tileLayer(A+'/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, opacity:.9 });
const esriSatLabels = L.layerGroup([esriSat, esriLabel]);
const esriClarity = L.tileLayer('https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution:'Esri Clarity', maxZoom:21 });
const gSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { attribution:'Google (no oficial)', subdomains:['mt0','mt1','mt2','mt3'], maxZoom:21 });
const gHyb = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { attribution:'Google híbrido (no oficial)', subdomains:['mt0','mt1','mt2','mt3'], maxZoom:21 });
const voyager  = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution:'CARTO Voyager', maxZoom:20 });
const positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution:'CARTO Positron', maxZoom:20 });
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'OpenStreetMap', maxZoom:19 });

esriSatLabels.addTo(map);   // capa por defecto
L.control.layers({
  'Esri satélite + etiquetas': esriSatLabels,
  'Esri satélite (limpio)': esriSat,
  'Esri Clarity (alta res)': esriClarity,
  'Google satélite': gSat,
  'Google híbrido': gHyb,
  'CARTO Voyager': voyager,
  'CARTO Positron': positron,
  'OpenStreetMap': osm
}, null, { collapsed:false, position:'topright' }).addTo(map);

const layer = L.layerGroup().addTo(map);
let holeBounds = {};   // number -> L.LatLngBounds (para volar al hoyo desde la leyenda)

/* ---------- Geometría ---------- */
function haversine(a, b){            // a,b = [lat,lng] → metros
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(b[0]-a[0]), dLng=toRad(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function polyCentroid(poly){
  let lat=0,lng=0; poly.forEach(p=>{ lat+=p[0]; lng+=p[1]; });
  return [lat/poly.length, lng/poly.length];
}
function midpoint(a,b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }

/* ---------- Iconos (DOM seguro, sin innerHTML) ---------- */
function numberIcon(num){
  const el = document.createElement('div'); el.className='hole-num'; el.textContent=num;
  return L.divIcon({ className:'', iconSize:[26,26], iconAnchor:[13,13], html:el });
}
function flagIcon(kind){
  const el = document.createElement('div'); el.className='flag'; el.textContent = kind==='tee'?'🚩':'⛳';
  return L.divIcon({ className:'', iconSize:[24,24], iconAnchor:[12,22], html:el });
}
function distIcon(txt){
  const el = document.createElement('div'); el.className='dist'; el.textContent=txt;
  return L.divIcon({ className:'', iconSize:[1,1], iconAnchor:[0,0], html:el });
}

/* ---------- Pintar el campo ---------- */
function render(doc){
  layer.clearLayers();
  holeBounds = {};
  const holes = (doc.holes||[]).slice().sort((a,b)=>(a.number||0)-(b.number||0));
  const allPts = [];
  let totalPar=0, totalDist=0;

  holes.forEach(h=>{
    const pts=[];
    if(h.polygon && h.polygon.length){
      L.polygon(h.polygon, {color:'#22c55e',weight:2,fillColor:'#22c55e',fillOpacity:.18}).addTo(layer);
      h.polygon.forEach(p=>{ pts.push(p); allPts.push(p); });
      L.marker(polyCentroid(h.polygon), {interactive:false, icon:numberIcon(h.number)}).addTo(layer);
    }
    if(h.tee){ pts.push(h.tee); allPts.push(h.tee); L.marker(h.tee,{icon:flagIcon('tee'),title:`Hoyo ${h.number} · tee`}).addTo(layer); }
    if(h.green){ pts.push(h.green); allPts.push(h.green); L.marker(h.green,{icon:flagIcon('green'),title:`Hoyo ${h.number} · green`}).addTo(layer); }

    let dist=null;
    if(h.tee && h.green){
      L.polyline([h.tee,h.green], {color:'#fde047',weight:2,dashArray:'5,6',opacity:.9}).addTo(layer);
      dist = Math.round(haversine(h.tee,h.green));
      totalDist += dist;
      L.marker(midpoint(h.tee,h.green), {interactive:false, icon:distIcon(dist+' m')}).addTo(layer);
    }
    if(h.par) totalPar += h.par;
    if(pts.length) holeBounds[h.number] = L.latLngBounds(pts);
    h._dist = dist;
  });

  // Estadísticas
  document.getElementById('stats').style.display = 'flex';
  document.getElementById('st-holes').textContent = holes.length;
  document.getElementById('st-par').textContent = totalPar || '—';
  document.getElementById('st-dist').textContent = totalDist ? totalDist.toLocaleString('es-ES') : '—';

  // Cabecera
  document.getElementById('course-title').textContent = '⛳ ' + (doc.course_name || 'Plano del campo');
  document.getElementById('course-sub').textContent = `${holes.length} hoyos cartografiados`;

  renderLegend(holes);

  const hint = document.getElementById('drop-hint'); if(hint) hint.remove();
  if(allPts.length) map.fitBounds(L.latLngBounds(allPts).pad(0.15));
}

function renderLegend(holes){
  const cont = document.getElementById('legend');
  cont.replaceChildren();
  holes.forEach(h=>{
    const li = document.createElement('div'); li.className='li';
    const num = document.createElement('div'); num.className='num'; num.textContent=h.number;
    const info = document.createElement('div'); info.className='info';
    const b = document.createElement('b'); b.textContent = `Hoyo ${h.number}${h.name?' · '+h.name:''}`;
    const s = document.createElement('small');
    const parts=[]; if(h.par) parts.push('Par '+h.par); if(h._dist) parts.push(h._dist+' m');
    s.textContent = parts.join(' · ') || 'sin tee/green';
    info.append(b,s);
    li.append(num,info);
    li.onclick = ()=>{ if(holeBounds[h.number]) map.fitBounds(holeBounds[h.number].pad(0.4)); };
    cont.appendChild(li);
  });
}

/* ---------- Carga de archivo ---------- */
function loadFile(f){
  const r = new FileReader();
  r.onload = ()=>{ try{ render(JSON.parse(r.result)); }catch(err){ alert('holes.json inválido: '+err.message); } };
  r.readAsText(f);
}
document.getElementById('btn-load').onclick = ()=>document.getElementById('file-holes').click();
document.getElementById('file-holes').onchange = (e)=>{ if(e.target.files[0]) loadFile(e.target.files[0]); };

// Arrastrar y soltar sobre el mapa
const mapEl = document.getElementById('map');
['dragover','dragenter'].forEach(ev=>mapEl.addEventListener(ev, e=>{ e.preventDefault(); }));
mapEl.addEventListener('drop', e=>{
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if(f) loadFile(f);
});
